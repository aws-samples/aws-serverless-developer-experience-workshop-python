[project]
name = "contracts_service"
version = "0.2.0"
description = "Unicorn Properties Contact Service"
authors = [
    {name = "Amazon Web Services"}
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "aws-lambda-powertools[tracer]>=3.34.0",
    "aws-xray-sdk>=2.15.0",
    "boto3>=1.43.75",
]

[project.optional-dependencies]
dev = [
    "aws-lambda-powertools[all]>=3.34.0",
    "requests>=2.34.2",
    "moto[dynamodb,events,sqs]>=5.2.2",
    "importlib-metadata>=9.0.0",
    "pyyaml>=6.0.3",
    "arnparse>=0.0.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "tomli>=2.4.1",
]

[tool.setuptools]
package-dir = {"contracts_service" = "src"}
packages = ["contracts_service"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -vv -W ignore::UserWarning --cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]