name: Auto Assign

on:
  pull_request:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  add-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read .github/auto_assign.yml
      pull-requests: write
    steps:
      - name: Assign reviewers
        uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
