name: Label PR based on title

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads PR details only; never runs PR code
    workflows: ["Record PR details"]
    types:
      - completed

permissions: {}

jobs:
  get_pr_details:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # download the PR details artifact
      contents: read
    uses: ./.github/workflows/reusable_export_pr_details.yml
    with:
      record_pr_workflow_id: ${{ github.event.workflow_run.id }}
      workflow_origin: ${{ github.event.repository.full_name }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  label_pr:
    needs: get_pr_details
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Label PR based on title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.get_pr_details.outputs.prNumber }}
          PR_TITLE: ${{ needs.get_pr_details.outputs.prTitle }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Runs in the base repository, not the fork, so it can use a write token
          # to label the PR from its semantic title.
          script: |
            const script = require('.github/scripts/label_pr_based_on_title.js')
            await script({github, context, core})
