[project]
name = "approvals_service"
version = "0.2.0"
description = "Unicorn Properties Property Service"
authors = [
    {name = "Amazon Web Services"}
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "aws-lambda-powertools[tracer]>=3.39.0",
    "aws-xray-sdk>=2.16.0",
    "boto3>=1.43.125",
]

[project.optional-dependencies]
dev = [
    "aws-lambda-powertools[all]>=3.39.0",
    "requests>=2.34.2",
    "moto[dynamodb,events,sqs]>=5.2.5",
    "importlib-metadata>=10.1.0",
    "pyyaml>=6.0.3",
    "arnparse>=0.0.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.setuptools]
package-dir = {"approvals_service" = "src"}
packages = ["approvals_service"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -vv -W ignore::UserWarning --cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.coverage.run]
omit = ["*/schema/*"]
